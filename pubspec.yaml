name: sparkle_scrollbar
description: A customizable GPU-accelerated particle and glow shader scrollbar for Flutter with multi-axis support and haptic feedback.
version: 0.0.8
homepage: https://github.com/PouyaBaniadam/sparkle_scrollbar

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  shaders:
    - shaders/sparkle_scrollbar.frag